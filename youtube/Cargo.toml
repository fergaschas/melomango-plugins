[package]
name = "melomango-youtube"
version = "0.3.0"
description = "Plugin de Melomango: todo el catálogo de YouTube vía yt-dlp"
edition = "2024"

[[bin]]
name = "melomango-youtube"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

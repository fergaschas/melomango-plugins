[package]
name = "melomango-spotify"
version = "0.1.0"
description = "Plugin de Melomango: importa tus playlists, Me gusta y álbumes de Spotify (solo metadatos)"
edition = "2024"

[[bin]]
name = "melomango-spotify"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
